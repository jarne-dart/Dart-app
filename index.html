/* ================= Konto & Server (optional, Supabase) ================= */
/* Die App spricht nur Funktionen (RPC) des Servers an. PIN-Prüfung, Sperre und Rechte liegen auf dem Server (siehe supabase-setup.sql). */
const CLOUD={url:'',key:''};
function cloudLoadCfg(){
  let u='',k='';
  try{const w=typeof window!=='undefined'&&window.DART_CLOUD;if(w){u=w.url||'';k=w.key||'';}}catch(e){}
  try{const s=JSON.parse(localStorage.getItem('dart-cloud')||'null');if(s){u=u||s.url||'';k=k||s.key||'';}}catch(e){}
  CLOUD.url=String(u||'').trim().replace(/\/+$/,'');CLOUD.key=String(k||'').trim();
}
const cloudOn=()=>!!(CLOUD.url&&CLOUD.key&&/^https:\/\//.test(CLOUD.url));
const ACC={id:'',name:'',token:'',pub:false,busy:false,err:'',msg:'',tab:'login',name2:'',pin:'',pin2:'',oldpin:'',cfgUrl:'',cfgKey:''};
const PROF={list:null,loading:false,err:'',open:null,data:{}};
function accLoad(){
  try{const s=JSON.parse(localStorage.getItem('dart-acc')||'null');if(s&&s.token&&s.id){ACC.id=String(s.id);ACC.name=String(s.name||'');ACC.token=String(s.token);ACC.pub=!!s.pub;}}catch(e){}
}
function accSave(){try{if(ACC.token) localStorage.setItem('dart-acc',JSON.stringify({id:ACC.id,name:ACC.name,token:ACC.token,pub:ACC.pub})); else localStorage.removeItem('dart-acc');}catch(e){}}
const CLOUD_ERR={bad_name:'Der Name muss 2 bis 16 Zeichen lang sein.',bad_pin:'Die PIN muss aus genau 6 Ziffern bestehen.',name_taken:'Diesen Namen gibt es schon. Melde dich an oder wähle einen anderen.',
  bad_login:'Name oder PIN stimmt nicht.',locked:'Zu viele Fehlversuche. Bitte in 15 Minuten noch einmal versuchen.',no_session:'Du bist nicht mehr angemeldet. Bitte neu anmelden.',
  not_found:'Dieses Profil ist nicht (mehr) öffentlich.',too_big:'Die Daten sind zu groß.',bad_data:'Ungültige Daten.'};
async function rpc(fn,args){
  if(!cloudOn()) throw new Error('Server ist nicht eingerichtet.');
  const ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(()=>{if(ctl)ctl.abort();},15000);
  try{
    const r=await fetch(CLOUD.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:CLOUD.key},/^eyJ/.test(CLOUD.key)?{Authorization:'Bearer '+CLOUD.key}:{}),body:JSON.stringify(args||{}),signal:ctl?ctl.signal:undefined});
    const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
    if(!r.ok) throw new Error(r.status===404?'Server-Funktionen fehlen. Wurde supabase-setup.sql ausgeführt?':(j&&(j.message||j.hint))||('Serverfehler '+r.status));
    if(j&&typeof j==='object'&&!Array.isArray(j)&&j.error) throw new Error(CLOUD_ERR[j.error]||String(j.error));
    return j;
  }catch(e){
    if(e&&e.name==='AbortError') throw new Error('Keine Antwort vom Server (Zeitüberschreitung).');
    if(e instanceof TypeError) throw new Error('Keine Verbindung zum Server. Bist du online?');
    throw e;
  }finally{clearTimeout(to);}
}
const totalGames=st=>st?['x01','c121','cricket','clock','killer'].reduce((a,k)=>a+((st[k]&&+st[k].games)||0),0):0;
/* Das lokale Profil, das zum angemeldeten Konto gehört (wird bei Bedarf angelegt) */
function accLocalUser(){
  if(!ACC.id) return null;
  let u=STORE.users.find(x=>x.cid===ACC.id)||STORE.users.find(x=>!x.cid&&x.name.toLowerCase()===ACC.name.toLowerCase());
  if(!u){const r=createUser(ACC.name);if(r.err) return null;u=r.user;}
  u.cid=ACC.id;return u;
}
function accRecentGames(u){return (u.games||[]).slice(0,5);}
/* Abgleich nach der Anmeldung: Wer mehr Spiele hat, gewinnt (so geht nichts verloren) */
async function accSync(){
  const u=accLocalUser();if(!u) return;
  const me=await rpc('dart_me',{p_token:ACC.token});
  const cloudN=totalGames(me.stats),localN=totalGames(u.st);
  if(cloudN>localN){u.st=normStats(me.stats);u.hist=normHist(me.hist);u.games=normGames(me.games);}
  const cb=normBp(me.bp),merged=mergeBp(u.bp,cb);
  u.skin=normSkin(cb.pts>u.bp.pts&&me.skin&&Object.keys(me.skin).length?me.skin:u.skin,merged);u.bp=merged;
  if(localN>=cloudN||cb.pts<merged.pts) await cloudPush(u);
  ACC.pub=!!me.public;accSave();saveStore();
}
async function cloudPush(u){
  if(!ACC.token||!u||u.cid!==ACC.id||!cloudOn()) return;
  await rpc('dart_push',{p_token:ACC.token,p_stats:u.st,p_hist:u.hist.slice(-300),p_games:accRecentGames(u)});
  try{await rpc('dart_push_char',{p_token:ACC.token,p_skin:u.skin,p_bp:u.bp});}catch(e){if(/anmelden/.test(e.message)) throw e;}
}
let pushTimer=0,pushBusy=false;
function cloudPushSoon(){
  if(!ACC.token||!cloudOn()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{
    if(pushBusy) return cloudPushSoon();
    pushBusy=true;
    try{const u=STORE.users.find(x=>x.cid===ACC.id);await cloudPush(u);ACC.err='';}
    catch(e){ACC.err='Statistik konnte nicht hochgeladen werden: '+e.message;if(/anmelden/.test(e.message)) {ACC.token='';accSave();}}
    finally{pushBusy=false;if(typeof render==='function'&&ui.screen==='account') render();}
  },800);
}
async function accEnter(kind){
  if(ACC.busy) return;
  const name=String(ACC.name2||'').trim(),pin=String(ACC.pin||'');
  ACC.err='';ACC.msg='';
  if(name.length<2){ACC.err=CLOUD_ERR.bad_name;return render();}
  if(!/^\d{6}$/.test(pin)){ACC.err=CLOUD_ERR.bad_pin;return render();}
  if(kind==='register'&&pin!==ACC.pin2){ACC.err='Die beiden PINs sind nicht gleich.';return render();}
  ACC.busy=true;render();
  try{
    const r=await rpc(kind==='register'?'dart_register':'dart_login',{p_name:name,p_pin:pin});
    Object.assign(ACC,{id:r.id,name:r.name,token:r.token,pub:!!r.public,pin:'',pin2:''});accSave();
    await accSync();
    ACC.msg=kind==='register'?'Konto angelegt. Du bist angemeldet.':'Angemeldet.';
  }catch(e){ACC.err=e.message;}
  ACC.busy=false;render();
}

function formatText(c){
  const lw=Math.ceil(c.legsBo/2);

/* ================= 3D-Figur (eigener Mini-Renderer, keine Bibliothek) ================= */
/* Aufbau aus Kugeln, Kapseln und Zylindern, Gesichtsteile liegen auf der Kopfoberfläche (von der Seite korrekt) */
const _fibC={};
function fib(n){
  if(_fibC[n]) return _fibC[n];
  const a=[];for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),th=i*2.399963;a.push([Math.cos(th)*r,y,Math.sin(th)*r]);}
  return _fibC[n]=a;
}
const _unit=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];};
function mixHex(c,f){const r=_hex(c);const h=x=>('0'+Math.max(0,Math.min(255,Math.round(x*f))).toString(16)).slice(-2);return '#'+h(r[0])+h(r[1])+h(r[2]);}
const HC=[0,2.3,0],HR=.5;           // Kopf wird in "Kopfeinheiten" gebaut und danach auf die Körpergröße skaliert
const HEAD_AT=[0,2.56,0],HS=.72;
const onHead=(d,kk)=>[HC[0]+d[0]*HR*kk,HC[1]+d[1]*HR*kk,HC[2]+d[2]*HR*kk];
function figParts(k,bust){
  const P=[];
  const S=(p,r,c,o)=>P.push(Object.assign({t:'s',x:p[0],y:p[1],z:p[2],r,c},o||{}));
  const Cy=(x,y,z,r,h,c)=>P.push({t:'c',x,y,z,r,h,c});
  const F=(d,kk,r,c,o)=>{const p=onHead(d,kk);P.push({t:'f',x:p[0],y:p[1],z:p[2],nx:d[0],ny:d[1],nz:d[2],r,c,o:o||null});};
  const cap=(a,b,r,c,n,nv)=>{n=n||4;for(let i=0;i<=n;i++){const t=i/n;S([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],r,c,{n:nv||[0,.15,1]});}};
  const pants='#2d3347',shirtC=SHIRT_COL[k.shirt]||SHIRT_COL.blue,sk=k.sc,hc=k.hc,GOLD='#d9b13a';
  const sleeve=sd=>mixHex(k.shirt==='split'?(sd<0?'#2f6fd1':'#d33b3b'):k.shirt==='stripes'?'#2f6fd1':shirtC,.9);
  const H=[.46,1.46,.48]; // Hand, die den Gegenstand hält

  /* Beine, Schuhe, Becken */
  [-1,1].forEach(sd=>{cap([sd*.15,1.25,0],[sd*.15,.2,0],.125,pants,7);S([sd*.15,.1,.08],.13,'#1d1d22',{n:[0,.3,1]});S([sd*.15,.09,.22],.105,'#1d1d22',{n:[0,.3,1]});});
  S([0,1.27,0],.27,pants,{n:[0,.3,1]});

  /* Hinten getragene Extras */
  if(k.extra==='cape'||k.extra==='cape2'){const c=k.extra==='cape'?'#c0272d':GOLD;for(let j=0;j<7;j++)for(let i=0;i<5;i++)S([-.3+i*.15,2.07-j*.13,-.3-j*.01],.13,c,{n:[0,0,-1]});}
  if(k.extra==='wings')[-1,1].forEach(sd=>{for(let i=0;i<5;i++)for(let j=0;j<3;j++)S([sd*(.4+i*.2),2.1+i*.12-j*.2,-.32-i*.02],.12,j===2?'#e4e4e4':'#f6f6f6',{n:[0,0,-1]});});

  /* Oberkörper: Schale aus Kugeln, Querschnitt oval, Taille schmaler */
  const RX=[.30,.27,.27,.30,.34,.37,.38,.34,.22];
  for(let j=0;j<9;j++){
    const y=1.25+j*.1065,rx=RX[j],rz=rx*.68;
    for(let a=0;a<14;a++){
      const ang=a/14*6.2832,cx=Math.cos(ang),sz=Math.sin(ang);
      let c=shirtC;
      if(k.shirt==='stripes') c=(j>>1)%2?'#eeeeee':'#2f6fd1';
      else if(k.shirt==='split') c=cx<0?'#2f6fd1':'#d33b3b';
      S([cx*rx,y,sz*rz],j===8?.12:.155,c,{n:[cx*.8,.1,sz*.8+.2]});
    }
  }
  [-1,1].forEach(sd=>S([sd*.4,2.04,0],.13,sleeve(sd),{n:[sd*.5,.3,.8]}));
  Cy(0,2.2,0,.09,.2,sk);

/* ================= The 100 ================= */
const H100={st:null,err:'',busy:false,run:null,off:0,tab:'day',rew:'',res:null,tm:0};
const H100_KIND={
  finish:['Finish-Folge','10 Finishes nacheinander, je 3 Darts. Es zählen die geschafften Finishes, bei Gleichstand weniger Darts und die schnellere Zeit.'],
  doubles:['Doppel-Training','10 Doppel nacheinander, je 3 Darts. Es zählen die Treffer, bei Gleichstand weniger Darts und die schnellere Zeit.'],
  score:['Score-Jagd','10 Aufnahmen mit je 3 Darts. Es zählt die Gesamtpunktzahl.']
};
const H100_IMPOSSIBLE=[163,166,169,172,173,175,176,178,179];
const h100Now=()=>Date.now()+H100.off;
const h100Min=s=>[1,2,3].find(l=>checkout(s,l,null,false))||3;
function h100Fmt(ms){ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0');}
const h100Res=(kind,x)=>kind==='score'?`${x.score} Punkte`:`${x.score}/10 · ${x.darts} Darts`;
function h100Save(){try{if(H100.run) localStorage.setItem('dart-h100run',JSON.stringify({day:H100.st&&H100.st.day,res:H100.run.res}));else localStorage.removeItem('dart-h100run');}catch(e){}}
async function h100Load(){
  if(!cloudOn()||H100.busy) return;
  try{
    const st=await rpc('dart100_status',{p_token:ACC.token||null});
    H100.st=st;H100.off=Date.parse(st.now)-Date.now();H100.err='';
    if(ACC.token) h100Rewards();
  }catch(e){H100.err=e.message;}
  if(ui.screen==='h100'&&!H100.run) render();
}
/* Monatsbelohnungen (Platz 1 bis 3) dem Charakter gutschreiben */
async function h100Rewards(){
  try{
    const r=await rpc('dart100_rewards',{p_token:ACC.token}),u=STORE.users.find(x=>x.cid&&x.cid===ACC.id);
    if(!u||!r||!Array.isArray(r.rewards)) return;
    const added=[];
    r.rewards.forEach(w=>EVENT_ITEMS.filter(x=>w.rank<=x.rank).forEach(x=>{if(!u.bp.unl.includes(x.id)){u.bp.unl.push(x.id);added.push(x.n);}}));
    if(added.length){saveStore();cloudPushSoon();H100.rew='Neue Monatsbelohnung: '+added.join(', ')+'. Du findest sie unter Charakter.';if(ui.screen==='h100') render();}
  }catch(e){}
}
async function h100Start(){
  if(H100.busy) return;
  H100.busy=true;H100.err='';render();
  try{
    const r=await rpc('dart100_start',{p_token:ACC.token});
    let res=[];
    try{const s=JSON.parse(localStorage.getItem('dart-h100run')||'null');if(r.resume&&s&&H100.st&&s.day===H100.st.day&&Array.isArray(s.res)) res=s.res.slice(0,10);}catch(e){}
    H100.run={kind:r.kind,targets:r.targets,res,val:'',err:''};
    h100Save();
  }catch(e){H100.err=e.message;}
  H100.busy=false;render();
}
function h100Answer(entry){
  const run=H100.run;if(!run||run.res.length>=10) return;
  run.res.push(entry);run.val='';run.err='';h100Save();
  if(run.res.length>=10) h100Submit();
}
async function h100Submit(){
  const run=H100.run;if(!run||H100.busy) return;
  H100.busy=true;run.err='';render();
  try{
    const r=await rpc('dart100_submit',{p_token:ACC.token,p_result:run.res});
    H100.res={kind:run.kind,score:r.score,darts:r.darts,secs:r.secs};
    H100.run=null;h100Save();
    const u=STORE.users.find(x=>x.cid&&x.cid===ACC.id);
    if(u){bpAdd(u.bp,BP_H100);saveStore();cloudPushSoon();}
    H100.busy=false;await h100Load();
  }catch(e){run.err=e.message;if(/Ungültig|bad_result|schnell|abgelaufen|bereits|expired/i.test(e.message)) run.fatal=true;}
  H100.busy=false;render();
}
function h100Tick(){
  if(H100.tm||typeof setInterval!=='function') return;
  H100.tm=setInterval(()=>{
    if(ui.screen!=='h100'||H100.run||H100.busy||!H100.st) return;
    const st=H100.st,n=h100Now(),b=Date.parse(st.opens),c=Date.parse(st.closes),old=st.state;
    const ns=n<b?'before':n<c?'open':'closed';
    if(ns!==old){h100Load();return;}
    render();
  },1000);
}
function h100Board(st){
  const kind=st.kind;
  if(H100.tab==='month'){
    const m=st.ranking||[];
    return (m.length?`<table class="lb"><tr><th>#</th><th>Spieler</th><th>Punkte</th></tr>${m.map(x=>`<tr class="${x.me?'me':''}"><td>${x.rank}</td><td>${esc(x.name)}</td><td>${x.pts}<small> · ${x.days} Tage</small></td></tr>`).join('')}</table>`:'<div class="rules">Noch keine Wertung in diesem Monat. Punkte gibt es, sobald ein Tag beendet ist.</div>')
      +(st.my_month?`<div class="rules" style="margin-top:8px">Du: Platz ${st.my_month.rank} mit ${st.my_month.pts} Punkten.</div>`:'');
  }
  const d=st.lb||[];
  return d.length?`<table class="lb"><tr><th>#</th><th>Spieler</th><th>Ergebnis</th><th>Pkt.</th></tr>${d.map(x=>`<tr class="${x.me?'me':''}"><td>${x.rank}</td><td>${esc(x.name)}</td><td>${h100Res(kind,x)}<small> · ${h100Fmt(x.secs*1000)}</small></td><td>+${x.pts}</td></tr>`).join('')}</table>`
    :'<div class="rules">Noch kein Ergebnis für heute.</div>';
}

      <div class="h1card"><div class="h1name">${esc(k[0])}</div><div class="h1desc">${esc(k[1])}</div>${state}</div>

/* ---------- Feldstatistik ---------- */
function polarPt(r,deg){const a=deg*Math.PI/180;return [(r*Math.sin(a)).toFixed(2),(-r*Math.cos(a)).toFixed(2)];}
function ringPath(r1,r2,a1,a2){
  const [x1,y1]=polarPt(r2,a1),[x2,y2]=polarPt(r2,a2),[x3,y3]=polarPt(r1,a2),[x4,y4]=polarPt(r1,a1);
  return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
}
function heatSVG(counts){
  const max=Math.max(1,...Object.values(counts));
  const col=k=>{const c=counts[k]||0;return c?`rgba(61,220,151,${(0.2+0.8*c/max).toFixed(2)})`:'#222d39';};
  let t=`<svg class="heat" viewBox="-206 -206 412 412" role="img" aria-label="Trefferbild: je heller, desto öfter getroffen"><circle r="204" fill="#0b0f13"/>`;
  ORDER.forEach((n,i)=>{
    const a1=i*18-9,a2=i*18+9;
    t+=`<path d="${ringPath(R.bullOut,R.trIn,a1,a2)}" fill="${col('S'+n)}" stroke="#0e1318" stroke-width=".8"/>`;
    t+=`<path d="${ringPath(R.trIn,R.trOut,a1,a2)}" fill="${col('T'+n)}" stroke="#0e1318" stroke-width=".8"/>`;
    t+=`<path d="${ringPath(R.trOut,R.dbIn,a1,a2)}" fill="${col('S'+n)}" stroke="#0e1318" stroke-width=".8"/>`;
    t+=`<path d="${ringPath(R.dbIn,R.dbOut,a1,a2)}" fill="${col('D'+n)}" stroke="#0e1318" stroke-width=".8"/>`;
    const [tx,ty]=polarPt(190,i*18);
    t+=`<text x="${tx}" y="${ty}" fill="#8c9bab" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">${n}</text>`;
  });
  t+=`<circle r="${R.bullOut}" fill="${col('S25')}" stroke="#0e1318" stroke-width=".8"/><circle r="${R.bullIn}" fill="${col('BULL')}" stroke="#0e1318" stroke-width=".8"/>`;
  return t+`</svg>`;
}
function fieldModal(){
  const f=ui.fv;
  if(!f) return '';
  let counts,title,tabs='';
  if(f.src==='game'){
    if(!G) return '';
    const pi=Math.min(f.pi||0,G.players.length-1);
    counts=G.players[pi].f||{};title=G.players[pi].name;
    if(G.players.length>1) tabs=`<div class="seg2">${G.players.map((q,i)=>`<button class="${i===pi?'on':''}" data-act="fv-pi" data-v="${i}">${esc(q.name)}</button>`).join('')}</div>`;
  } else {
    const u=findUser(f.uid)||profUser(f.uid);
    if(!u) return '';
    counts=u.st.fields;title=u.name+' · alle Spiele';
  }
  const tot=Object.values(counts).reduce((a,b)=>a+b,0);
  const sum=pre=>Object.keys(counts).filter(k=>k.startsWith(pre)).reduce((a,k)=>a+counts[k],0);
  const rate=v=>tot?Math.round(v/tot*100)+' %':'–';
  const max=Math.max(1,...Object.values(counts));
  const cell=c=>`<td style="${c?`background:rgba(61,220,151,${(0.12+0.5*c/max).toFixed(2)})`:''}">${c||'·'}</td>`;
  let rows='';
  for(let n=1;n<=20;n++) rows+=`<tr><td class="z">${n}</td>${cell(counts['S'+n]||0)}${cell(counts['D'+n]||0)}${cell(counts['T'+n]||0)}</tr>`;
  rows+=`<tr><td class="z">25 / Bull</td>${cell(counts.S25||0)}${cell(counts.BULL||0)}<td>–</td></tr><tr><td class="z">Miss</td><td colspan="3">${counts.MISS||0}</td></tr>`;
  const body=tot?`${heatSVG(counts)}
    <div class="rates"><div><b>${rate(sum('S'))}</b>Single</div><div><b>${rate(sum('D'))}</b>Double</div><div><b>${rate(sum('T'))}</b>Triple</div><div><b>${rate(counts.BULL||0)}</b>Bull</div><div><b>${rate(counts.MISS||0)}</b>Miss</div></div>
    <table class="ft"><tr><th>Zahl</th><th>Single</th><th>Double</th><th>Triple</th></tr>${rows}</table>`
    :`<p class="note">Noch keine Würfe erfasst.</p>`;
  return `<div class="modal" style="z-index:30"><div class="card fcard"><h2>${esc(title)} · ${tot} Darts</h2>${tabs}${body}<div class="row" style="margin-top:12px"><button class="next" data-act="fv-close">Schließen</button></div></div></div>`;
}

/* ---------- Verlauf: Average und Checkout-Quote ---------- */
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function bucketOf(t,range){
  const d=new Date(t);
  if(range==='month'){const s=new Date(d.getFullYear(),d.getMonth(),1);return {start:s.getTime(),label:`${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`};}
  if(range==='week'){const s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return {start:s.getTime(),label:`${s.getDate()}.${s.getMonth()+1}.`};}
  const s=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  return {start:s.getTime(),label:`${s.getDate()}.${s.getMonth()+1}.`};
}
function chartSeries(u,metric,range){
  const map=new Map();
  for(const h of u.hist){
    const b=bucketOf(h.t,range);
    let e=map.get(b.start);
    if(!e){e={start:b.start,label:b.label,d:0,p:0,a:0,h:0,n:0};map.set(b.start,e);}
    e.d+=h.d;e.p+=h.p;e.a+=h.a;e.h+=h.h;e.n++;
  }
  const arr=[...map.values()].sort((x,y)=>x.start-y.start);
  arr.forEach(e=>{e.v=metric==='avg'?(e.d?e.p/e.d*3:null):(e.a?e.h/e.a*100:null);});
  return arr.filter(e=>e.v!=null).slice(-12);
}
function chartPanel(u){
  const metric=ui.chartMetric,range=ui.chartRange,pts=chartSeries(u,metric,range);
  const colr=metric==='avg'?'#3987e5':'#d95926';
  const ctl=`<div class="seg2">${[['avg','Ø Average'],['co','Checkout-Quote']].map(([k,t])=>`<button class="${metric===k?'on':''}" data-act="cmetric" data-v="${k}">${t}</button>`).join('')}</div>
    <div class="seg2">${[['day','Tage'],['week','Wochen'],['month','Monate']].map(([k,t])=>`<button class="${range===k?'on':''}" data-act="crange" data-v="${k}">${t}</button>`).join('')}</div>`;
  if(!pts.length) return `<div class="chartbox">${ctl}<div class="note">Noch keine Daten. Spiele ein 301/501/701-Spiel mit diesem Benutzer zu Ende.</div></div>`;
  const W=340,H=190,L=36,Rr=14,T=18,B=26,iw=W-L-Rr,ih=H-T-B,len=pts.length;
  let ymax,ticks=[];
  if(metric==='co') ymax=100; else ymax=Math.max(20,Math.ceil(Math.max(...pts.map(q=>q.v))*1.1/20)*20);
  for(let i=0;i<=4;i++) ticks.push(ymax/4*i);
  const X=i=>len===1?L+iw/2:L+i*iw/(len-1),Y=v=>T+ih-(v/ymax)*ih;
  const val=v=>metric==='avg'?v.toFixed(1):Math.round(v)+' %';
  const sel=ui.chartSel!=null&&ui.chartSel<len?ui.chartSel:len-1;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${metric==='avg'?'Average':'Checkout-Quote'} im Zeitverlauf">`;
  ticks.forEach(tk=>{svg+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(tk)}" y2="${Y(tk)}" stroke="#2d3b4a" stroke-width="1"/><text x="${L-6}" y="${Y(tk)}" fill="#8c9bab" font-size="10" text-anchor="end" dominant-baseline="central">${metric==='avg'?Math.round(tk):Math.round(tk)+'%'}</text>`;});
  if(len>1) svg+=`<polyline points="${pts.map((q,i)=>`${X(i).toFixed(1)},${Y(q.v).toFixed(1)}`).join(' ')}" fill="none" stroke="${colr}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const step=Math.ceil(len/6);
  pts.forEach((q,i)=>{
    const on=i===sel;
    svg+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="${on?5.5:4}" fill="${colr}" stroke="#222d39" stroke-width="2"/>`;
    if(i%step===0||i===len-1&&(len-1)%step>=Math.ceil(step/2)) svg+=`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#8c9bab" font-size="10" text-anchor="middle">${esc(q.label)}</text>`;
  });
  const sq=pts[sel];
  svg+=`<text x="${X(sel).toFixed(1)}" y="${(Y(sq.v)-10).toFixed(1)}" fill="#eef2f6" font-size="11" font-weight="700" text-anchor="middle">${val(sq.v)}</text>`;
  pts.forEach((q,i)=>{svg+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="14" fill="transparent" data-act="cpt" data-v="${i}"/>`;});
  svg+='</svg>';
  const unit=range==='day'?'Tag':range==='week'?'Woche (ab Montag)':'Monat';
  const table=pts.slice().reverse().map(q=>`${esc(q.label)}: <b>${val(q.v)}</b> · ${q.n} Spiel${q.n>1?'e':''}`).join('<br>');
  return `<div class="chartbox">${ctl}<div class="readout"><b>${val(sq.v)}</b> · ${esc(sq.label)} · ${sq.n} Spiel${sq.n>1?'e':''}</div>${svg}<div class="note">Je Punkt ein ${unit}, nur mit Spielen (301/501/701), letzte ${len}. Punkt antippen für Details.</div><div class="ctab">${table}</div></div>`;
}

function boardSVG(marks){
  const pt=(r,deg)=>{const a=deg*Math.PI/180;return [(r*Math.sin(a)).toFixed(2),(-r*Math.cos(a)).toFixed(2)];};
  const ring=(r1,r2,a1,a2)=>{
    const [x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);
    return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
  };
  let s=`<svg id="board" viewBox="-206 -206 412 412" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Dartboard, antippen um einen Wurf zu erfassen"><circle r="204" fill="#0b0f13"/>`;
  ORDER.forEach((n,i)=>{
    const a1=i*18-9,a2=i*18+9,even=i%2===0;
    const single=even?'#1b1b1b':'#f1e6c3',col=even?'#d63a3a':'#2f9e5a';
    s+=`<path d="${ring(R.bullOut,R.trIn,a1,a2)}" fill="${single}"/>`;
    s+=`<path d="${ring(R.trIn,R.trOut,a1,a2)}" fill="${col}"/>`;
    s+=`<path d="${ring(R.trOut,R.dbIn,a1,a2)}" fill="${single}"/>`;
    s+=`<path d="${ring(R.dbIn,R.dbOut,a1,a2)}" fill="${col}"/>`;
    const [tx,ty]=pt(188,i*18);
    s+=`<text x="${tx}" y="${ty}" fill="#e8edf2" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">${n}</text>`;
  });
  s+=`<circle r="${R.bullOut}" fill="#2f9e5a"/><circle r="${R.bullIn}" fill="#d63a3a"/>`;
  s+=`<g stroke="#8a8f94" stroke-width=".5" fill="none" opacity=".7">`;
  for(let i=0;i<20;i++){const [x1,y1]=pt(R.bullOut,i*18+9),[x2,y2]=pt(R.dbOut,i*18+9);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
  [R.bullIn,R.bullOut,R.trIn,R.trOut,R.dbIn,R.dbOut].forEach(r=>s+=`<circle r="${r}"/>`);
  s+=`</g>`;
  const last=marks.length-1;
  marks.forEach((k,i)=>{
    const col=PCOL[k.p%PCOL.length],nw=i===last;
    s+=`<circle cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="${nw?7:5}" fill="${col}" fill-opacity="${nw?1:.6}" stroke="${nw?'#fff':'#000'}" stroke-width="${nw?2:1.2}"/>`;
  });
  return s+`</svg>`;
}

function keypad(){
  let k=`<div class="mult">${[[1,'Single'],[2,'Double'],[3,'Triple']].map(([m,t])=>`<button class="${ui.mult===m?'on':''}" data-act="mult" data-v="${m}">${t}</button>`).join('')}</div><div class="keys">`;
  for(let n=1;n<=20;n++) k+=`<button class="n" data-act="num" data-v="${n}">${n}</button>`;
  k+=`<button class="k25" data-act="sb">25</button><button class="kb" data-act="bull">Bullseye</button><button class="km" data-act="miss">Miss</button></div>`;
  return k;
}
const specialBtns=()=>`<div class="spec"><button data-act="sb">25</button><button data-act="bull">Bullseye</button><button class="m" data-act="miss">Miss</button></div>`;
const bullBtns=()=>`<div class="spec"><button data-act="b-bull">Bullseye</button><button data-act="b-25">25</button><button class="m" data-act="b-miss">Daneben</button></div>`;

function cricketTable(){
  const g=G,multi=g.match&&(g.match.legsToWin>1||g.match.setsToWin>0);
  const head=`<tr><th></th><th></th>${NUMS.map(n=>`<th>${n===25?'B':n}</th>`).join('')}</tr>`;
  const rows=g.players.map((p,i)=>{
    const lg=multi?` <small>${g.match.setsToWin?`${g.match.setsWon[i]}·`:''}${g.match.legsWon[i]}</small>`:'';
    return `<tr class="${i===g.cur&&g.phase==='throw'?'act':''}"><td class="nm"><span class="dot" style="background:${PCOL[i]}"></span>${esc(p.name)}${lg}</td><td class="sc">${p.score}</td>${NUMS.map(n=>{
      const m=p.marks[n];
      return `<td><span class="pips ${m>=3?'closed':''}">${[1,2,3].map(j=>`<span class="pip ${m>=j?'on':''}"></span>`).join('')}</span></td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<table class="cr"><colgroup><col style="width:27%"><col style="width:13%">${NUMS.map(()=>'<col style="width:8.57%">').join('')}</colgroup>${head}${rows}</table>`;
}

const fmt=d=>d.n===25?(d.m===2?'50':'25'):String(d.val);
const coText=q=>q.dAtt?`${pct(q.dHit,q.dAtt)} (${q.dHit}/${q.dAtt})`:'–';

function lifetimeLines(g){
  const m=g.cfg.mode;
  return g.players.map(p=>{
    const u=statUser(p);
    if(!u) return '';
    const s=u.st;
    if(isStd(m)){const x=s.x01;return `<b>${esc(u.name)}</b> gesamt: Ø ${avgOf(x.pts,x.darts)} · Checkout ${pct(x.dHit,x.dAtt)} · ${x.games} Spiele`;}
    if(is121(m)){const x=s.c121,b=g.cfg.easy?x.bestEasy:x.best;return `<b>${esc(u.name)}</b> gesamt: bestes Ziel${g.cfg.easy?' (Easy)':''} ${b||'–'} · ${x.hits}/${x.attempts} Versuche`;}
    const x=m==='cricket'?s.cricket:m==='killer'?s.killer:s.clock;
    return `<b>${esc(u.name)}</b> gesamt: ${x.wins}/${x.games} Siege`;
  }).filter(Boolean).join('<br>');
}

/* Immer gleich hoch, damit sich nichts verschiebt */
function routesHTML(g,p){
  const c=g.cfg,left=3-g.turn.length;
  if(g.phase!=='throw'||!isX01(c.mode)||p.out==='straight'||!p.started||p.bot||left<1) return `<div class="routes"></div>`;
  const rs=checkoutRoutes(p.score,left,favOf(p),is121(c.mode)?3:2,p.out==='master');
  if(!rs.length) return `<div class="routes">${p.score<=170?`<span class="noroute">Kein Checkout mit ${left} Dart${left>1?'s':''} möglich</span>`:''}</div>`;
  return `<div class="routes">${rs.map((r,i)=>`<span class="route ${i?'alt':''} ${r.fav?'fav':''}">${r.darts.map(lbl).join(' ')}</span>`).join('')}</div>`;
}

const fmtBull=r=>r===3?'Bull':r===11?'25':r===170?'daneben':(Math.round(r*10)/10)+' mm';
function camPanel(){
  const st=CAM.state,k=CAM.pts.length;
  const B=(a,t,x)=>`<button class="small ${x||''}" data-act="${a}">${t}</button>`;
  let txt='',btns='',ph='';
  if(st==='off'){txt='Kamera starten, dann das Board einmal kalibrieren. Nur auf eigener https-Adresse möglich.';btns=B('cam-start','Kamera starten','go');ph='📷';}
  else if(st==='error'){txt=esc(CAM.err);btns=B('cam-start','Nochmal versuchen','go');ph='📷';}
  else if(st==='starting'){txt='Kamera startet … bitte Zugriff erlauben.';ph='…';}
  else if(st==='calib'){txt=`Tippe die Drahtkreuzung ${CAL_NAMES[k]} am äußeren Rand des Doppelrings an (${k+1}/4).`;btns=B('cam-recal','Neu setzen')+B('cam-stop','Stopp');}
  else if(st==='capture'){txt='Passt das grüne Raster? Rote Punkte ziehen zum Feinjustieren. Dann bei leerem Board „Basis aufnehmen“.';btns=B('cam-base','Basis aufnehmen','go')+B('cam-recal','Neu kalibrieren')+B('cam-stop','Stopp');}
  else if(st==='baseline'){txt='Basisbild wird aufgenommen … Board nicht berühren.';btns=B('cam-stop','Stopp');}
  else{txt=`Bereit – wirf! Empfindlichkeit ${SENS[CAM.sens].n}.${CAM.warn?' ⚠ '+esc(CAM.warn):''} Falsch erkannt? ↶ drücken oder Tasten nutzen.`;btns=B('cam-base','Basis neu')+B('cam-recal','Kalibrieren')+B('cam-sens','Empf.: '+SENS[CAM.sens].n)+B('cam-flip','Kamera ⇄')+B('cam-stop','Stopp');}
  return `<div class="campanel"><div class="camslot" id="camslot">${ph}</div><div class="camtxt">${txt}</div><div class="camctl">${btns}</div></div>`;
}
function renderGame(){
  const g=G,c=g.cfg,p=cur(),x=isX01(c.mode),n=g.players.length,r121=is121(c.mode),m=g.match;
  const mine=!g.online||p.owner===NET.me,watch=!!p.bot||!mine;
  const multi=m&&(m.legsToWin>1||m.setsToWin>0);
  const live=!['over','legover','bullwin'].includes(g.phase);
  const kill=c.mode==='killer';
  let top='';
  if(c.mode==='cricket') top=cricketTable();
  else{
    const cards=g.players.map((q,i)=>{
      let big,lines=[];
      if(x){
        big=q.score;
        if(r121){lines.push(['',`Ziel ${q.target} · V ${Math.min(q.attempts+1,c.attempts)}/${c.attempts}`],['',`Best ${q.best||'–'} · CO ${pct(q.dHit,q.dAtt)}`]);}
        else lines.push(['',`Ø ${avgOf(q.pts,q.darts)}`],['',`CO ${coText(q)}`]);
      } else if(kill){
        big=q.num==null?'?':q.num;
        const mx=c.lives||3,lv=Math.max(0,q.lives);
        lines.push(['','♥'.repeat(lv)+'♡'.repeat(mx-lv)],[q.lives<=0?'hp':'',q.lives<=0?'ausgeschieden':q.killer?'KILLER':q.num==null?'':'Anwärter']);
      } else {big=q.idx>=20?'Bull':CLOCK[q.idx];lines.push(['',`${q.darts} Darts`]);}
      if(multi) lines.push(['lg',n>=3?(m.setsToWin?`S ${m.setsWon[i]} · L ${m.legsWon[i]}`:`Legs ${m.legsWon[i]}`):`${m.setsToWin?`Sätze ${m.setsWon[i]} · `:''}Legs ${m.legsWon[i]}`]);
      const hc=hcText(q,c);
      if(hc) lines.push(['lg',esc(hc)]);
      return {q,i,big,lines};
    });
    const h=64+Math.round(Math.max(...cards.map(k=>k.lines.length))*14.6);
    top=`<div class="players" style="grid-template-columns:repeat(${n},1fr)">${cards.map(k=>`<div class="pc c${n} ${k.i===g.cur&&live?'act':''} ${kill&&k.q.lives<=0?'dead':''}" style="height:${h}px"><div class="nm"><span class="dot" style="background:${PCOL[k.i]}"></span>${figCanvas(k.q.sk||normSkin(null),26,26,{bust:1})}<span class="nt">${k.q.off?'⚠ ':''}${esc(k.q.name)}</span></div><div class="big">${k.big}</div>${k.lines.map(l=>`<div class="meta ${l[0]}">${l[1]}</div>`).join('')}</div>`).join('')}</div>`;
  }

  const slots=[0,1,2].map(i=>{
    const d=g.turn[i];
    if(!d) return `<div class="slot empty"><div class="l">–</div><div class="v"></div></div>`;
    return `<div class="slot ${d.void?'void':''} ${d.bust?'bust':''}"><div class="l">${lbl(d)}</div><div class="v">${x?(d.void?'zählt nicht':fmt(d)):''}</div></div>`;
  }).join('');

  const review=g.phase==='review',bull=g.phase==='bull',kpick=g.phase==='kpick';
  let msg='',cls='';
  if(bull) msg=`Ausbullen${g.bull.round>1?' (Gleichstand)':''}: ${esc(p.name)} wirft auf Bull`;
  else if(kpick) msg=watch?`${esc(p.name)} wählt eine Zahl …`:`${esc(p.name)}: wirf auf eine freie Zahl (1–20)`;
  else if(g.bust){msg='BUST – Punktestand zurückgesetzt';cls='bad';}
  else if(g.checked){msg=`✔ Checkout! Ziel ${p.target} geschafft`;cls='good';}
  else if(review) msg=watch?`${esc(p.name)}: Aufnahme beendet`:'Darts ziehen, dann „Weiter“';
  else if(g.phase==='throw'){
    msg=watch?`${esc(p.name)} wirft …`:`${esc(p.name)} ist dran`;
    if(r121) msg+=` · Aufnahme ${p.turnNo+1}/3`;
    if(kill) msg+=p.killer?' · Killer':` · Doppel ${p.num} zum Killer`;
  }
  const routes=routesHTML(g,p);
  const camTab=ui.input==='cam'&&!bull&&!watch&&g.phase!=='bullwin';
  const inputOff=!camTab&&(['review','legover','over','bullwin'].includes(g.phase)||!!watch);
  let inputBody;
  if(bull) inputBody=`<div class="bwrap">${boardSVG(g.marks)}</div>${bullBtns()}`;
  else if(camTab) inputBody=camPanel();
  else if(ui.input==='board'||ui.input==='cam'||(watch&&(g.phase==='throw'||g.phase==='review'||kpick))) inputBody=`<div class="bwrap">${boardSVG(g.marks)}</div>${specialBtns()}`;
  else inputBody=keypad();

  let modal='';
  if(g.phase==='bullwin'){
    const b=g.bull,w=g.players[b.winner];
    modal=`<div class="ovl" data-act="skipbull"><div class="big">🎯 ${esc(w.name)}<br>beginnt!</div><div class="sub">${b.queue.map(k=>`${esc(g.players[k].name)}: ${fmtBull(b.res[k])}`).join(' · ')}</div><div class="sub" style="opacity:.55">Tippen zum Überspringen</div></div>`;
  } else if(g.phase==='legover'){
    const li=g.legInfo,w=g.players[li.winner],show=li.setWon?li.setsShown:li.legsShown;
    const line=g.players.map((q,i)=>`${esc(q.name)} ${show[i]}`).join(' : ');
    const setsLine=m.setsToWin&&!li.setWon?`<p class="life" style="text-align:center">Sätze: ${g.players.map((q,i)=>`${esc(q.name)} ${li.setsShown[i]}`).join(' : ')}</p>`:'';
    modal=`<div class="modal"><div class="card"><h2>${esc(w.name)} gewinnt ${li.setWon?'den Satz':'das Leg'}!</h2>
      <div class="score">${line}</div>${setsLine}
      <div class="row">${w.bot||!canUndo()?'':`<button class="ghost" data-act="undo">Wurf korrigieren</button>`}<button class="next" data-act="nextleg">${li.setWon?'Nächster Satz':'Nächstes Leg'}</button></div></div></div>`;
  } else if(g.phase==='over'){
    const w=g.winner>=0?g.players[g.winner]:null;
    let th,tr;
    if(r121){th='<th>Spieler</th><th>Bestes Ziel</th><th>Geschafft</th><th>Darts</th>';tr=q=>`<td>${esc(q.name)}</td><td>${q.best||'–'}</td><td>${q.hits}/${q.attempts}</td><td>${q.darts}</td>`;}
    else if(x){th='<th>Spieler</th><th>Ø</th><th>Checkout</th><th>Darts</th><th>Beste</th>';tr=q=>`<td>${esc(q.name)}</td><td>${avgOf(q.pts,q.darts)}</td><td>${coText(q)}</td><td>${q.darts}</td><td>${q.hi}</td>`;}
    else if(c.mode==='cricket'){th='<th>Spieler</th><th>Darts</th><th>MPR</th>';tr=q=>`<td>${esc(q.name)}</td><td>${q.darts}</td><td>${q.darts?(q.mpt/q.darts*3).toFixed(1):'–'}</td>`;}
    else if(kill){th='<th>Spieler</th><th>Zahl</th><th>Kills</th><th>Darts</th>';tr=q=>`<td>${esc(q.name)}</td><td>${q.num==null?'–':q.num}</td><td>${q.kills}</td><td>${q.darts}</td>`;}
    else{th='<th>Spieler</th><th>Darts</th><th>Treffer</th>';tr=q=>`<td>${esc(q.name)}</td><td>${q.darts}</td><td>${q.hits}</td>`;}
    let result='';
    if(multi){const arr=m.setsToWin?m.setsWon:m.legsWon;result=`<div class="score">${g.players.map((q,i)=>`${esc(q.name)} ${arr[i]}`).join(' : ')}</div>`;}
    const life=lifetimeLines(g);
    modal=`<div class="modal"><div class="card"><h2>${w?'🏆 '+esc(w.name)+' gewinnt!':'Spiel beendet – kein Finish geschafft'}</h2>${result}
      <table><tr>${th}</tr>${g.players.map(q=>`<tr>${tr(q)}</tr>`).join('')}</table>
      ${life?`<p class="life">${life}</p>`:''}${gainLines(g)}
      <div class="row">${(w&&w.bot)||!canUndo()?'':`<button class="ghost" data-act="undo">Wurf korrigieren</button>`}${NET.role==='guest'?'<div class="note" style="align-self:center">Revanche startet der Host</div>':'<button class="next" data-act="rematch">Revanche</button>'}</div>
      <div class="row" style="margin-top:8px"><button class="ghost" data-act="fv-game">Feldstatistik</button><button class="ghost" data-act="menu-yes">Zum Menü</button></div></div></div>`;
  } else if(ui.askMenu){
    modal=`<div class="modal"><div class="card"><h2>${g.online?(NET.role==='host'?'Raum schließen?':'Spiel verlassen?'):'Spiel abbrechen?'}</h2><p style="color:var(--muted);margin:0 0 14px">${g.online?(NET.role==='host'?'Das beendet das Spiel für alle Mitspieler.':'Mit dem Raumcode und deinem Namen kannst du wieder beitreten.'):'Ein abgebrochenes Spiel wird nicht in die Statistik übernommen.'}</p>
      <div class="row"><button class="ghost" data-act="menu-no">Weiterspielen</button><button class="next" data-act="menu-yes">Zum Menü</button></div></div></div>`;
  }

  let sub=isStd(c.mode)?(c.doubleOut?'Double-Out':'Straight-Out')+(c.doubleIn?' · Double-In':''):r121?`${c.easy?'Easy · ':''}${c.attempts} Versuche`:c.mode==='clock'&&c.skip?'Überspringen':kill?`${c.lives||3} Leben`:'';
  if(multi) sub=(m.setsToWin?`Satz ${m.setNo} (Bo${c.setsBo}) · Leg ${m.legNo} (Bo${c.legsBo})`:`Leg ${m.legNo} (Bo${c.legsBo})`)+(sub?' · '+sub:'');
  const canEnd=(g.phase==='throw'||review)&&!watch;
  const right=kpick
    ?`<button class="small ic" data-act="undo" aria-label="Rückgängig" ${canUndo()?'':'disabled'}>↶</button><button class="small go" data-act="krandom" ${watch?'disabled':''}>Zufällig</button>`
    :`<button class="small ic" data-act="undo" aria-label="Rückgängig" ${canUndo()?'':'disabled'}>↶</button><button class="small ${review&&!watch?'go':''}" data-act="next" ${canEnd?'':'disabled'}>Weiter ▸</button>`;
  root.innerHTML=`<div class="game">
    <div class="gtop"><div class="t"><b>${g.online?'🌐 ':''}${MODE_NAMES[c.mode]}</b>${esc(sub)}</div><div class="hb">${(SRC&&c.voice!=='offline')||(c.voice==='offline'&&offAvail())?`<button class="small ic ${REC.on?'live':''}" data-act="mic" aria-label="Spracheingabe">🎤</button>`:''}${c.caller?`<button class="small ic" data-act="mute" aria-label="Ansage an/aus">${SPK.muted?'🔇':'🔊'}</button>`:''}<button class="small" data-act="menu">Menü</button></div></div>
    ${top}
    <div class="strip"><div class="slots">${slots}</div><div class="msg ${cls}">${msg}</div>${routes}<div class="lastline${(!(ui.heard&&Date.now()-ui.heard.t<4000)&&(NET.err||REC.err))?' err':''}">${ui.heard&&Date.now()-ui.heard.t<4000?esc('🎤 „'+ui.heard.text+'“'+(ui.heard.ok?'':' – nicht erkannt')):esc(NET.err||REC.err||g.lastText||'')}</div></div>
    <div class="bar"><div class="seg"><button class="${ui.input==='board'?'on':''}" data-act="input" data-v="board">Board</button><button class="${ui.input==='keys'?'on':''}" data-act="input" data-v="keys">Tasten</button><button class="${ui.input==='cam'?'on':''} ${CAM.state==='ready'?'rdy':''}" data-act="input" data-v="cam" aria-label="Kamera">📷</button></div>
      <div class="acts">${right}</div></div>
    <div class="input ${inputOff?'off':''}">${inputBody}</div>
    ${modal}${fieldModal()}
  </div>`;
}

/* Bots werfen mit kurzer Pause, damit man ihre Darts sieht */
let autoTimer=null;
function schedule(){
  clearTimeout(autoTimer);autoTimer=null;
  if(NET.role==='guest'||ui.screen!=='game'||!G||ui.askMenu||ui.fv) return;
  const ph=G.phase,bot=G.players[G.cur]&&G.players[G.cur].bot;
  const go=(ms,fn)=>{autoTimer=setTimeout(()=>{autoTimer=null;fn();render();},ms);};
  if(ph==='bullwin') go(2000,afterBull);
  else if(ph==='bull'&&bot) go(900,botBull);
  else if(ph==='kpick'&&bot) go(700,botPick);
  else if(ph==='throw'&&bot) go(G.turn.length?650:800,botThrow);
  else if(ph==='review'&&bot) go(1000,nextPlayer);
}
function render(){
  ({home:renderHome,modes:renderModes,setup:renderSetup,settings:renderSettings,account:renderAccount,profiles:renderProfiles,stats:renderStats,char:renderChar,h100:renderH100,me:renderMe,lobby:renderLobby,join:renderJoin}[ui.screen]||renderGame)();
  try{if(document.documentElement&&document.documentElement.setAttribute) document.documentElement.setAttribute('data-theme',themeOf(ui.cfg.theme));}catch(e){}
  netSync();
  if(typeof document!=='undefined'&&document.body&&document.body.classList) document.body.classList.toggle('gamemode',ui.screen==='game');
  if(ui.screen==='game'&&ui.input==='cam') camAttach();
  if(ui.focusNew){const f=root.querySelector('[data-newname]');if(f)f.focus();ui.focusNew=false;}
  const showTabs=TAB_SCREENS.includes(ui.screen)&&!(ui.screen==='h100'&&H100.run);
  if(showTabs) root.innerHTML+=tabbar();
  try{document.body.classList.toggle('tabs',showTabs);}catch(e){}
  if(ui.screen==='h100') h100Tick();
  figKick();
  schedule();
}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}};

function doCreate(i){
  const r=createUser(ui.newText);
  if(r.err){ui.err=r.err;ui.focusNew=true;return;}
  ui.cfg.slots.forEach((s,j)=>{if(j!==i&&s.uid===r.user.id)s.uid=null;});
  ui.cfg.slots[i].uid=r.user.id;ui.cfg.slots[i].bot=0;
  ui.newSlot=null;ui.newText='';ui.err='';saveSetup();
}
function addFavRoute(){
  const u=findUser(ui.editUser);
  if(!u) return;
  const sc=parseInt(ui.favScore,10);
  if(!(sc>=2&&sc<=170)){ui.favErr='Der Rest muss zwischen 2 und 170 liegen.';return;}
  const pr=parseRoute(ui.favRoute);
  if(pr.err){ui.favErr=pr.err;return;}
  const e=routeError(sc,pr.darts);
  if(e){ui.favErr=e;return;}
  u.fav.routes[sc]=pr.darts.map(d=>[d.n,d.m]);
  saveStore();ui.favErr='';ui.favScore='';ui.favRoute='';
}

root.addEventListener('click',e=>{
  const bs=e.target.closest&&e.target.closest('#board');
  if(bs){
    if(!G||cur().bot) return;
    const pt=bs.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const q=pt.matrixTransform(bs.getScreenCTM().inverse());
    if(Math.hypot(q.x,q.y)>204) return;
    if(G.phase==='bull'){throwBull(Math.hypot(q.x,q.y),false,[q.x,q.y]);buzz();render();return;}
    if(G.phase!=='throw'&&G.phase!=='kpick') return;
    const h=hitFromPoint(q.x,q.y);
    h.pos=[q.x,q.y];
    throwDart(h);buzz();render();return;
  }
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='mode'){ui.cfg.mode=v;if(v==='killer'&&ui.cfg.players<2)ui.cfg.players=2;saveSetup();}
  else if(a==='players'){ui.cfg.players=ui.cfg.mode==='killer'?Math.max(2,+v):+v;ui.newSlot=null;saveSetup();}
  else if(a==='lives'){ui.cfg.lives=+v;saveSetup();}
  else if(a==='hcopen'){ui.hcOpen=ui.hcOpen===+v?null:+v;}
  else if(a==='attempts'){ui.cfg.attempts=+v;saveSetup();}
  else if(a==='easy'){ui.cfg.easy=v==='1';saveSetup();}
  else if(a==='legsbo'){ui.cfg.legsBo=+v;saveSetup();}
  else if(a==='setsbo'){ui.cfg.setsBo=+v;saveSetup();}
  else if(a==='start'){
    unlockSpeech();ui.newSlot=null;saveSetup();
    ui.cfg.starter=0;newGame(ui.cfg);ui.screen='game';
  }
  else if(a==='create'){doCreate(+v);}
  else if(a==='host-open'){NET.err='';unlockSpeech();netHostOpen();}
  else if(a==='join-open'){NET.err='';ui.join.name=ui.join.name||loadJoinName();ui.screen='join';}
  else if(a==='join-back'){NET.err='';netClose();ui.screen='home';}
  else if(a==='join-go'){unlockSpeech();netJoin();return;}
  else if(a==='lobby-start'){unlockSpeech();netStart();}
  else if(a==='lobby-close'){netClose();ui.screen='home';G=null;HIST=[];}
  else if(a==='cancelnew'){ui.newSlot=null;ui.err='';}
  else if(a==='stats'||a==='go-stats'){ui.screen='stats';ui.msg='';ui.exportText='';ui.editUser=null;}
  else if(a==='go-modes'){ui.screen='modes';}
  else if(a==='go-char'){ui.screen='char';}
  else if(a==='go-me'){ui.screen='me';}
  else if(a==='tab'){ui.screen=v;ui.editUser=null;ui.fv=null;if(v==='h100') h100Load();}
  else if(a==='h100-reload'){h100Load();}
  else if(a==='h100-tab'){H100.tab=v;}
  else if(a==='h100-start'){h100Start();return;}
  else if(a==='h100-hit'){h100Answer({h:true,d:+v});}
  else if(a==='h100-miss'){h100Answer({h:false,d:3});}
  else if(a==='h100-score'){const x=Math.round(+H100.run.val);if(H100.run.val===''||!Number.isFinite(x)||x<0||x>180||H100_IMPOSSIBLE.includes(x)) H100.run.err='Bitte eine mögliche Punktzahl von 0 bis 180 eingeben (z. B. ist 179 nicht möglich).';else h100Answer(x);}
  else if(a==='h100-undo'){if(H100.run&&H100.run.res.length&&!H100.busy){H100.run.res.pop();H100.run.err='';H100.run.fatal=false;h100Save();}}
  else if(a==='h100-send'){h100Submit();return;}
  else if(a==='h100-leave'){H100.run=null;H100.err='';h100Load();}
  else if(a==='char-tab'){ui.ctab=v;}
  else if(a==='char-user'){ui.cu=v;}
  else if(a==='skin-set'){const u=charUser();const [sl,id]=String(v).split(':');if(u&&itemOwned(u.bp,sl+':'+id)){u.skin[sl]=id;saveStore();}}
  else if(a==='skin-col'){const u=charUser();const [sl,c]=String(v).split(':');if(u&&(sl==='hc'||sl==='sc')&&hexOk(c)){u.skin[sl]=c;saveStore();}}
  else if(a==='pick-mode'){ui.cfg.mode=v;if(v==='killer'&&ui.cfg.players<2)ui.cfg.players=2;saveSetup();ui.screen='setup';}
  else if(a==='go-settings'){ui.screen='settings';ui.msg='';}
  else if(a==='go-account'){ui.screen='account';ACC.err='';ACC.msg='';}
  else if(a==='go-profiles'){ui.screen='profiles';PROF.open=null;PROF.err='';if(cloudOn()&&PROF.list===null) profLoadList();}
  else if(a==='prof-open'){profOpen(v);return;}
  else if(a==='prof-back'){PROF.open=null;ui.fv=null;ui.chartUser=null;}
  else if(a==='prof-refresh'){PROF.list=null;PROF.data={};PROF.open=null;profLoadList();return;}
  else if(a==='acc-tab'){ACC.tab=v;ACC.err='';ACC.msg='';ACC.pin='';ACC.pin2='';}
  else if(a==='acc-login'){accEnter('login');return;}
  else if(a==='acc-register'){accEnter('register');return;}
  else if(a==='acc-logout'){accLogout();return;}
  else if(a==='acc-pub'){accSetPublic(v==='1');return;}
  else if(a==='acc-pin'){accChangePin();return;}
  else if(a==='acc-sync'){(async()=>{ACC.busy=true;ACC.err='';ACC.msg='';render();try{await accSync();const u=accLocalUser();if(u) await cloudPush(u);ACC.msg='Statistik ist abgeglichen.';}catch(e){ACC.err=e.message;}ACC.busy=false;render();})();return;}
  else if(a==='cfg-save'){
    const u=String(ACC.cfgUrl||'').trim().replace(/\/+$/,''),k=String(ACC.cfgKey||'').trim();
    if(!/^https:\/\/[^\s]+$/.test(u)||k.length<20){ACC.err='Bitte die Projekt-Adresse (beginnt mit https://) und den langen öffentlichen Schlüssel eintragen.';}
    else{try{localStorage.setItem('dart-cloud',JSON.stringify({url:u,key:k}));}catch(e){}cloudLoadCfg();ACC.err='';ACC.msg='Server verbunden. Jetzt kannst du ein Konto anlegen.';}
  }
  else if(a==='cfg-clear'){try{localStorage.removeItem('dart-cloud');}catch(e){}CLOUD.url='';CLOUD.key='';try{const w=window.DART_CLOUD;if(w){CLOUD.url=w.url||'';CLOUD.key=w.key||'';}}catch(e){}ACC.msg='';}
  else if(a==='theme'){ui.cfg.theme=themeOf(v);saveSetup();}
  else if(a==='vreset'){ui.cfg.callVoice='';ui.cfg.callRate=1;ui.cfg.callPitch=1;saveSetup();}
  else if(a==='back'||a==='go-home'){ui.screen='home';ui.editUser=null;ui.fv=null;}
  else if(a==='editfav'){ui.editUser=ui.editUser===v?null:v;ui.favErr='';ui.favScore='';ui.favRoute='';}
  else if(a==='favd'){
    const u=findUser(ui.editUser);
    if(u){const k=u.fav.doubles.indexOf(+v);if(k>=0)u.fav.doubles.splice(k,1);else u.fav.doubles.push(+v);saveStore();}
  }
  else if(a==='favr-add'){addFavRoute();}
  else if(a==='favr-del'){const u=findUser(ui.editUser);if(u){delete u.fav.routes[v];saveStore();}}
  else if(a==='del'){ui.askDelete=v;}
  else if(a==='del-no'){ui.askDelete=null;}
  else if(a==='del-yes'){
    STORE.users=STORE.users.filter(u=>u.id!==ui.askDelete);
    ui.cfg.slots.forEach(s=>{if(s.uid===ui.askDelete)s.uid=null;});
    if(ui.editUser===ui.askDelete) ui.editUser=null;
    ui.askDelete=null;saveStore();saveSetup();
  }
  else if(a==='export'){ui.exportText=JSON.stringify({users:STORE.users});ui.msg='Backup erzeugt – Text kopieren und sicher aufbewahren.';}
  else if(a==='import'){
    const ta=root.querySelector('[data-imp]');
    try{
      const s=JSON.parse(ta?ta.value:'');
      if(!s||!Array.isArray(s.users)) throw new Error('format');
      STORE.users=cleanUsers(s.users);saveStore();
      ui.cfg.slots.forEach(sl=>{if(sl.uid&&!findUser(sl.uid))sl.uid=null;});saveSetup();
      ui.msg=`Import erfolgreich (${STORE.users.length} Benutzer).`;ui.exportText='';ui.editUser=null;
    }catch(err){ui.msg='Import fehlgeschlagen: kein gültiges Backup.';ui.exportText=ta?ta.value:'';}
  }
  else if(a==='mult'){ui.mult=+v;}
  else if(a==='input'){ui.input=v;}
  else if(a==='clang'){ui.cfg.lang=v;saveSetup();}
  else if(a==='voice'){ui.cfg.voice=v;if(REC.on)micStop();saveSetup();}
  else if(a==='off-load'){offLoad();return;}
  else if(a==='ctest'){unlockSpeech();say(CL().test,{flush:true});}
  else if(a==='mute'){SPK.muted=!SPK.muted;if(SPK.muted)speakCancel();}
  else if(a==='mic'){unlockSpeech();if(REC.on)micStop();else micStart();}
  else if(a==='cam-start'){camStart();return;}
  else if(a==='cam-stop'){camStop();}
  else if(a==='cam-base'){camBase();return;}
  else if(a==='cam-recal'){camRecal();return;}
  else if(a==='cam-sens'){CAM.sens=(CAM.sens+1)%3;}
  else if(a==='cam-flip'){CAM.facing=CAM.facing==='user'?'environment':'user';camStart();return;}
  else if(a==='num'){throwDart({n:+v,m:ui.mult});ui.mult=1;buzz();}
  else if(a==='sb'){throwDart({n:25,m:1});ui.mult=1;buzz();}
  else if(a==='bull'){throwDart({n:25,m:2});ui.mult=1;buzz();}
  else if(a==='miss'){throwDart({n:0,m:0});ui.mult=1;buzz();}
  else if(a==='b-bull'){throwBull(3,false,[0,0]);buzz();}
  else if(a==='b-25'){throwBull(11,false,[0,-11]);buzz();}
  else if(a==='b-miss'){throwBull(170,false,null);buzz();}
  else if(a==='skipbull'){afterBull();}
  else if(a==='krandom'){if(G&&!cur().bot)killerRandom();}
  else if(a==='fv-game'){ui.fv={src:'game',pi:0};}
  else if(a==='fv-user'){ui.fv={src:'user',uid:v};}
  else if(a==='fv-pi'){ui.fv={src:'game',pi:+v};}
  else if(a==='fv-close'){ui.fv=null;}
  else if(a==='chartuser'){ui.chartUser=ui.chartUser===v?null:v;ui.chartSel=null;}
  else if(a==='cmetric'){ui.chartMetric=v;ui.chartSel=null;}
  else if(a==='crange'){ui.chartRange=v;ui.chartSel=null;}
  else if(a==='cpt'){ui.chartSel=+v;}
  else if(a==='undo'){undo();}
  else if(a==='next'){if(G&&!cur().bot)nextPlayer();}
  else if(a==='nextleg'){nextLeg();}
  else if(a==='menu'){ui.askMenu=true;}
  else if(a==='menu-no'){ui.askMenu=false;}
  else if(a==='menu-yes'){ui.askMenu=false;ui.fv=null;ui.screen='home';speakCancel();micStop();camStop();netClose();G=null;HIST=[];committed=null;}
  else if(a==='rematch'){ui.fv=null;ui.cfg.starter=(G.cfg.starter||0)+1;newGame(ui.cfg);}
  render();
});
root.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.guest!==undefined){ui.cfg.slots[+d.guest].guest=e.target.value;saveSetup();}
  else if(d.newname!==undefined){ui.newText=e.target.value;}
  else if(d.joincode!==undefined){ui.join.code=e.target.value;}
  else if(d.joinname!==undefined){ui.join.name=e.target.value;}
  else if(d.favscore!==undefined){ui.favScore=e.target.value;}
  else if(d.favroute!==undefined){ui.favRoute=e.target.value;}
  else if(d.h100val!==undefined){if(H100.run) H100.run.val=e.target.value;}
  else if(d.skin!==undefined){const u=charUser();if(u&&(d.skin==='hc'||d.skin==='sc')&&hexOk(e.target.value)){u.skin[d.skin]=e.target.value;saveStore();}}
  else if(d.acc!==undefined){ACC[d.acc]=d.acc==='pin'||d.acc==='pin2'||d.acc==='oldpin'?e.target.value.replace(/\D/g,'').slice(0,6):e.target.value;}
});

/* Figur per Ziehen drehen */
if(typeof document.addEventListener==='function'){
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('canvas[data-spin="1"]');if(c){FIG.drag={x:e.clientX,y:FIG.yaw};try{c.setPointerCapture(e.pointerId);}catch(_){}}});
document.addEventListener('pointermove',e=>{if(FIG.drag) FIG.yaw=FIG.drag.y+(e.clientX-FIG.drag.x)*.015;});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{FIG.drag=null;}));
}
root.addEventListener('keydown',e=>{
  const d=e.target.dataset||{};
  if(e.key!=='Enter') return;
  if(d.newname!==undefined&&ui.newSlot!==null){e.preventDefault();doCreate(ui.newSlot);render();}
  else if(d.favscore!==undefined||d.favroute!==undefined){e.preventDefault();addFavRoute();render();}
  else if(d.acc!==undefined&&ui.screen==='account'){e.preventDefault();if(ACC.token) accChangePin(); else accEnter(ACC.tab==='register'?'register':'login');}
});
root.addEventListener('change',e=>{
  const d=e.target.dataset||{};
  if(d.joinuid!==undefined){const u=findUser(e.target.value);ui.join.uid=u?u.id:'';if(u) ui.join.name=u.name;render();return;}
  if(d.opt){ui.cfg[d.opt]=e.target.checked;saveSetup();}
  else if(d.callvoice!==undefined){ui.cfg.callVoice=e.target.value;saveSetup();}
  else if(d.callrate!==undefined){ui.cfg.callRate=+e.target.value||1;saveSetup();}
  else if(d.callpitch!==undefined){ui.cfg.callPitch=+e.target.value||1;saveSetup();}
  else if(d.botlvl!==undefined){ui.cfg.slots[+d.botlvl].bot=+e.target.value;saveSetup();}
  else if(d.hc!==undefined){
    const sl=ui.cfg.slots[+d.i];sl.hc=sl.hc||cleanHc(null);
    sl.hc[d.hc]=d.hc==='start'?+e.target.value:e.target.value;
    sl.hc=cleanHc(sl.hc);saveSetup();render();
  }
  else if(d.slot!==undefined){
    const i=+d.slot,v=e.target.value,sl=ui.cfg.slots[i];
    if(v==='__new'){ui.newSlot=i;ui.newText='';ui.err='';ui.focusNew=true;}
    else if(v==='__remote'){sl.remote=true;sl.bot=0;sl.uid=null;if(ui.newSlot===i)ui.newSlot=null;}
    else if(v==='__bot'){sl.remote=false;sl.bot=sl.bot||3;sl.uid=null;if(ui.newSlot===i)ui.newSlot=null;saveSetup();}
    else{sl.remote=false;sl.bot=0;sl.uid=v||null;if(ui.newSlot===i)ui.newSlot=null;saveSetup();}
    render();
  }
});
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
render();
